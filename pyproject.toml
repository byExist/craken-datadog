[project]
name = "datadog-mcp"
version = "0.1.0"
description = "Datadog (logs, metrics, traces, monitors) integration via MCP"
readme = "README.md"
authors = [
    { name = "byExist", email = "jongbeom.kwon@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.26.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pyright>=1.1.410",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["datadog_mcp"]

[tool.ruff.lint.per-file-ignores]
"src/datadog_mcp/tools.py" = ["UP040"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["tests"]

[tool.coverage.run]
source = ["datadog_mcp"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "tests"]
typeCheckingMode = "strict"

[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = false
